plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '3'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.26'
}

def releaseStoreFile = System.getenv('SENSEI_STORE_FILE') ?: localProperties.getProperty('sensei.storeFile') ?: 'upload-keystore.jks'
def releaseStorePassword = System.getenv('SENSEI_STORE_PASSWORD') ?: localProperties.getProperty('sensei.storePassword')
def releaseKeyAlias = System.getenv('SENSEI_KEY_ALIAS') ?: localProperties.getProperty('sensei.keyAlias') ?: 'st2026'
def releaseKeyPassword = System.getenv('SENSEI_KEY_PASSWORD') ?: localProperties.getProperty('sensei.keyPassword')
def expectedCertSha256 = System.getenv('SENSEI_EXPECTED_CERT_SHA256') ?: localProperties.getProperty('sensei.expectedCertSha256') ?: ''
def releaseKeystore = file(releaseStoreFile)
def hasReleaseSigning = releaseKeystore.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// Dual-ABI builds (2026-09): main ships BOTH arm64-v8a and armeabi-v7a so the
// same code produces marked per-ABI APKs (arm64 + armv7) from one build.
// CI can restrict a run via SENSEI_ABIS (change detection: a jniLibs-only bump
// for one ABI rebuilds only that ABI's APK). Values: comma list, e.g.
// "arm64-v8a" / "armeabi-v7a" / "arm64-v8a,armeabi-v7a". Default: both.
def senseiAbis = (System.getenv('SENSEI_ABIS') ?: 'arm64-v8a,armeabi-v7a')
        .split(',').collect { it.trim() }

android {
    namespace "com.sensei.tunnel"
    compileSdk 36
    // Pin the NDK: without this, AGP resolves its own default (8.4 → 26.1)
    // and auto-downloads it. 25.1.8937393 is what every shipped APK was built
    // with (AGP 8.2's default) and is installed both locally and in CI.
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // libsenseicrypto.so — all config crypto (pepper/seeds/AES-GCM) in native.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    defaultConfig {
        externalNativeBuild {
            cmake {
                // -fomit-frame-pointer: frees r7 (Thumb FP) for the inline EABI
                // svc wrappers in senseicrypto.c on armeabi-v7a; harmless on arm64.
                cFlags "-O2 -fvisibility=hidden -fomit-frame-pointer"
                abiFilters(*senseiAbis)
                // The expected signing-cert hash is baked into libsenseicrypto.so
                // as a compile definition — it never appears in the DEX
                // (BuildConfig no longer carries it).
                arguments "-DSENSEI_EXPECTED_CERT_SHA256=${expectedCertSha256}"
            }
        }
    }

    defaultConfig {
        applicationId "com.sensei.tunnel"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        // NO ndk { abiFilters } here — with `flutter build apk --split-per-abi`
        // the Flutter gradle plugin sets splits.abi itself, and AGP hard-fails
        // on "ndk abiFilters present when splits abi filters are set".
    }

    // Per-ABI APKs are produced by the flutter CLI itself:
    // `flutter build apk --split-per-abi --target-platform ...` makes the
    // Flutter gradle plugin configure splits.abi (one APK per requested ABI).
    // Do NOT add a gradle `splits` block or `ndk { abiFilters }` here — AGP
    // hard-fails on "ndk abiFilters present when splits abi filters are set".
    // cmake's abiFilters in the externalNativeBuild block stays (it only
    // limits which ABIs compile natively).

    // Play multi-APK requires distinct versionCodes per ABI. Offset scheme:
    // base*10 + 2 (arm64) / + 1 (armeabi-v7a) — monotonic above every old
    // single-APK versionCode (v1.0.53+59 → 592/591; 1.0.54+60 → 602/601).
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride = variant.versionCode * 10 + (abi == 'arm64-v8a' ? 2 : 1)
            }
        }
    }

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            // The config envelope is cert-bound (v3): the AES key derives from
            // the signing cert, so a debug APK signed with the default debug
            // keystore can NEVER fetch configs. Sign debug with the real key
            // when it is available (CI passes the secrets; local builds need
            // sensei.* in local.properties — see KEYSTORE.md).
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Keep jniLibs for native binaries (xray, tun2socks)
    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
    }

    packagingOptions {
        jniLibs {
            // MUST stay true: libxray/libtun2socks/libh2/libovpnexec are EXEC'd
            // from applicationInfo.nativeLibraryDir (SenseiTunnelVpnService), and
            // libovpncli.so is System.load()'d by absolute path — both need the
            // libs physically extracted (extractNativeLibs=true). The Play 16 KB
            // gate is about ELF segment alignment, and every shipped .so is
            // already 16 KB-aligned (readelf LOAD align >= 0x4000), so compressed
            // + extracted still passes. Do NOT flip this without first moving
            // the exec'd binaries to filesDir copies.
            useLegacyPackaging = true
            // Vulkan validation layer is a debug-only graphics layer (~244MB) the
            // app never uses — exclude it so debug APKs aren't bloated.
            excludes += ["**/libVkLayer_khronos_validation.so"]
            // 2026-09 dual-ABI: the legacy armeabi-v7a jniLibs are now SHIPPED
            // (32-bit support, armv7-32bit branch merged) — no v7a exclude.
            // The splits block packages each ABI into its own marked APK.
        }
        // libovpnexec.so is EXEC'd (it is a PIE executable, not a linked lib) and
        // libopenvpn.so is dlopen'd by it at runtime — stripping either breaks
        // the OpenVPN 2.x engine.
        doNotStrip += [
            "**/libxray.so",
            "**/libtun2socks.so",
            "**/libovpnexec.so",
            "**/libopenvpn.so",
        ]
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'net.i2p.crypto:eddsa:0.3.0'
}
