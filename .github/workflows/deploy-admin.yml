# Deploys the SnapDark Tunnel admin panel: Worker + React static assets +
# custom domain on the apex cloudv2roy.xyz (routes live in wrangler.toml).
#
# Runs on any push touching admin/ — CI has the fast network that pulls
# wrangler reliably, so no local toolchain is needed anywhere.
name: Deploy Admin Panel (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify → build UI → deploy Worker → set secrets → smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: admin
    env:
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Worker syntax + schema/crypto tests
        run: npm run verify

      - name: Install panel deps + typecheck + build
        working-directory: admin/ui
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run lint
          npm run build

      - name: Deploy Worker (script, assets, KV binding, custom domain)
        run: npx wrangler@4 deploy

      # Secrets are pushed after the first upload (the secrets API needs an
      # existing script). Idempotent — re-pushing the same values is a no-op.
      - name: Push Worker secrets (ADMIN_PASSWORD / JWT_SECRET / GITHUB_TOKEN / DEV_ACCOUNTS)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PANEL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_CONFIGS_PAT: ${{ secrets.CONFIGS_PAT }}
          DEV_ACCOUNTS: ${{ secrets.DEV_ACCOUNTS }}
        run: |
          test -n "$ADMIN_PASSWORD" || { echo "ADMIN_PANEL_PASSWORD secret missing"; exit 1; }
          test -n "$JWT_SECRET" || { echo "JWT_SECRET secret missing"; exit 1; }
          test -n "$GITHUB_CONFIGS_PAT" || { echo "CONFIGS_PAT secret missing"; exit 1; }
          test -n "$DEV_ACCOUNTS" || { echo "DEV_ACCOUNTS secret missing"; exit 1; }
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler@4 secret put ADMIN_PASSWORD
          printf '%s' "$JWT_SECRET" | npx wrangler@4 secret put JWT_SECRET
          printf '%s' "$GITHUB_CONFIGS_PAT" | npx wrangler@4 secret put GITHUB_TOKEN
          # Developer role ("user:pass[,user2:pass2]") — unlocks Admin accounts,
          # Backup & restore, Danger zone + dev-only audit logs.
          printf '%s' "$DEV_ACCOUNTS" | npx wrangler@4 secret put DEV_ACCOUNTS

      - name: Smoke test the live panel
        run: |
          sleep 8
          # NOTE: the custom domain is the APEX (cloudv2roy.xyz). The old
          # admin.cloudv2roy.xyz name no longer resolves — do not use it here.
          BASE=https://cloudv2roy.xyz
          echo "--- /api/backend (public branding, must NOT contain secrets) ---"
          curl -fsS "$BASE/api/backend"
          echo
          echo "--- panel gate ---"
          panel=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/Arman-tunnel/admin")
          echo "panel HTTP $panel"
          test "$panel" = "200"
          echo "--- origin root (must 302 to the panel, never 404) ---"
          root=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$BASE/")
          echo "root   $root"
          test "${root%% *}" = "302"
          case "$root" in
            *"/Arman-tunnel/admin/"*) ;;
            *) echo "root did not redirect to the panel"; exit 1 ;;
          esac
          # The legacy admin subdomain must open too (it is also routed to
          # this Worker). DNS records created by wrangler can take a little
          # to propagate — retry before failing.
          echo "--- legacy admin.cloudv2roy.xyz ---"
          for i in 1 2 3 4 5; do
            legacy=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://admin.cloudv2roy.xyz/Arman-tunnel/admin" || echo 000)
            echo "try $i: panel HTTP $legacy"
            test "$legacy" = "200" && break
            sleep 6
          done
          test "$legacy" = "200"
