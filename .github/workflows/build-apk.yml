# Automated Android APK build for SnapDark Tunnel.
#
# Toolchain (pinned by app/README.md):
#   Flutter 3.47.7 · JDK 17 · compileSdk/targetSdk 36 · build-tools 35
#   NDK 25.1.8937393 · CMake 3.22.1 · Gradle 8.11.1 / AGP 8.7.3 (wrapper-pinned)
#
# Outputs: split-per-ABI release APKs (arm64-v8a + armeabi-v7a), signed with
# the upload keystore stored in secrets, cert-bound config feed enabled via
# SNAPDARK_EXPECTED_CERT_SHA256. The APKs are uploaded as a workflow artifact
# AND published as a GitHub Release on the public configs repo (direct
# download link).
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    name: Analyze → test → release APKs → publish download
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      SNAPDARK_STORE_FILE: upload-keystore.jks
      SNAPDARK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SNAPDARK_KEY_ALIAS: arman2026
      SNAPDARK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SNAPDARK_EXPECTED_CERT_SHA256: ${{ secrets.APP_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Android SDK packages (platform 36, build-tools 35, NDK, CMake)
        run: |
          set -euo pipefail
          # sdkmanager is not on PATH on hosted runners — locate it explicitly.
          SM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${SM:-}" ] || [ ! -x "$SM" ]; then
            echo "sdkmanager not found under ANDROID_HOME=${ANDROID_HOME:-unset}"; exit 1
          fi
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" \
                     "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Restore release keystore + verify cert hash matches the feed
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks || { echo "keystore decode failed"; exit 1; }
          ACTUAL=$(keytool -list -v -keystore android/app/upload-keystore.jks \
                     -storepass "$SNAPDARK_STORE_PASSWORD" -alias "$SNAPDARK_KEY_ALIAS" 2>/dev/null \
                   | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "keystore cert: $ACTUAL"
          echo "feed     cert: $SNAPDARK_EXPECTED_CERT_SHA256"
          test "$ACTUAL" = "$SNAPDARK_EXPECTED_CERT_SHA256" || {
            echo "CERT MISMATCH — the config feed would refuse to decrypt on this build"; exit 1; }
          # Fail in seconds, not after an 8-minute build: AGP reads the private
          # key with KeyStore.getKey(alias, KEY_PASSWORD). keytool cannot check
          # this (PKCS12 sources ignore -srckeypass), so mirror it in Java.
          cat > /tmp/CheckKey.java <<'JEOF'
          import java.io.FileInputStream;
          import java.security.KeyStore;
          public class CheckKey {
            public static void main(String[] a) throws Exception {
              KeyStore ks = KeyStore.getInstance("PKCS12");
              ks.load(new FileInputStream(a[0]), a[1].toCharArray());
              if (ks.getKey(a[2], a[3].toCharArray()) == null) {
                throw new IllegalStateException("key entry decrypts to null");
              }
              System.out.println("key password OK for alias " + a[2]);
            }
          }
          JEOF
          java /tmp/CheckKey.java android/app/upload-keystore.jks \
            "$SNAPDARK_STORE_PASSWORD" "$SNAPDARK_KEY_ALIAS" "$SNAPDARK_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Fetch xray-core engine binaries (app/README §5)
        run: |
          set -euo pipefail
          J=android/app/src/main/jniLibs
          mkdir -p "$J/arm64-v8a" "$J/armeabi-v7a"
          curl -fL --retry 5 --retry-delay 3 -o /tmp/xray-arm64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v25.5.16/Xray-android-arm64-v8a.zip
          curl -fL --retry 5 --retry-delay 3 -o /tmp/xray-arm32.zip \
            https://github.com/XTLS/Xray-core/releases/download/v25.5.16/Xray-linux-arm32-v7a.zip
          unzip -o -q /tmp/xray-arm64.zip -d /tmp/x64
          unzip -o -q /tmp/xray-arm32.zip -d /tmp/x32
          install -m 0755 "$(find /tmp/x64 -type f -name xray | head -1)" "$J/arm64-v8a/libxray.so"
          install -m 0755 "$(find /tmp/x32 -type f -name xray | head -1)" "$J/armeabi-v7a/libxray.so"
          ls -la "$J"/*/libxray.so

      - name: Flutter deps
        run: flutter pub get

      - name: Analyze (primary gate)
        run: flutter analyze

      - name: Unit + widget tests
        run: flutter test

      # Kotlin JVM tests — the proxy relay's wire rules (SOCKS reply targeting
      # the client, Proxy-Authorization INSIDE the CONNECT headers, RFC1929
      # upstream auth) live in app/src/test and must gate the release too.
      - name: Kotlin unit tests (proxy handshake wire rules)
        run: cd android && ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build release APKs (split-per-ABI, obfuscated)
        run: |
          flutter build apk --release --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --split-per-abi \
            --target-platform android-arm,android-arm64

      # Integrity mesh (app/android/app/src/main/cpp): the native lib gates on
      # the SHA-256 of Dart's AOT blob (libapp.so). CI bakes the real per-ABI
      # hashes into the header (blank in the committed STUB = gate open), then
      # rebuilds — Dart AOT is deterministic for identical inputs, so the final
      # APKs still contain the exact blobs hashed below (verified).
      - name: Bake per-ABI libapp.so hashes into the mesh header + rebuild
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          A64_SHA=$(unzip -p "$APK_DIR/app-arm64-v8a-release.apk" lib/arm64-v8a/libapp.so | sha256sum | awk '{print $1}')
          A32_SHA=$(unzip -p "$APK_DIR/app-armeabi-v7a-release.apk" lib/armeabi-v7a/libapp.so | sha256sum | awk '{print $1}')
          echo "arm64-v8a libapp.so sha256: $A64_SHA"
          echo "armeabi-v7a libapp.so sha256: $A32_SHA"
          test -n "$A64_SHA" && test -n "$A32_SHA"
          cat > android/app/src/main/cpp/libapp_sha256.h <<EOF
          // GENERATED by .github/workflows/build-apk.yml — per-ABI SHA-256 of
          // the Dart AOT blob (libapp.so) for the integrity mesh. Never edit.
          #ifndef LIBAPP_SHA256_H
          #define LIBAPP_SHA256_H
          #if defined(__aarch64__)
          #define SNAPDARK_EXPECTED_LIBAPP_SHA256 "$A64_SHA"
          #else
          #define SNAPDARK_EXPECTED_LIBAPP_SHA256 "$A32_SHA"
          #endif
          #endif
          EOF
          flutter build apk --release --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --split-per-abi \
            --target-platform android-arm,android-arm64
          V64=$(unzip -p "$APK_DIR/app-arm64-v8a-release.apk" lib/arm64-v8a/libapp.so | sha256sum | awk '{print $1}')
          V32=$(unzip -p "$APK_DIR/app-armeabi-v7a-release.apk" lib/armeabi-v7a/libapp.so | sha256sum | awk '{print $1}')
          test "$V64" = "$A64_SHA" || { echo "MESH FAIL: arm64 libapp.so changed across rebuild"; exit 1; }
          test "$V32" = "$A32_SHA" || { echo "MESH FAIL: armv7 libapp.so changed across rebuild"; exit 1; }
          echo "mesh verified: final APKs match baked hashes"

      - name: Stage APKs with clean names
        run: |
          set -euo pipefail
          VER=$(node -e "const m=require('fs').readFileSync('pubspec.yaml','utf8').match(/^version:\s*([0-9.]+)/m);console.log(m[1])")
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/SnapDark-Tunnel-$VER-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/SnapDark-Tunnel-$VER-armeabi-v7a.apk"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: arman-tunnel-apk-${{ github.run_number }}
          path: |
            app/dist/*.apk
            app/build/app/outputs/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on the configs repo (direct download link)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CONFIGS_PAT }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}-b${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --repo Armanmiah2026/arman-tunnel-configs \
            --title "SnapDark Tunnel $APP_VERSION (build ${{ github.run_number }})" \
            --notes "Automated CI build. Install the APK matching your device: **arm64-v8a** (most phones) or armeabi-v7a (older/32-bit). Signed with the release key; config feed is cert-bound to it." \
          || gh release upload "$TAG" dist/*.apk --repo Armanmiah2026/arman-tunnel-configs --clobber
          echo "Release: https://github.com/Armanmiah2026/arman-tunnel-configs/releases/tag/$TAG"

      # The panel's "Force update" card auto-fills from this file: the exact
      # version name, the BASE build code (the app normalizes its split-ABI
      # code 631/632 back to 63 before comparing) and the download URLs.
      # Without it the admin has to type all three by hand — and one typo
      # means the app blocks on a version that does not exist.
      - name: Publish version.json (the panel's auto-fill source)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CONFIGS_PAT }}
        run: |
          set -euo pipefail
          REPO="Armanmiah2026/arman-tunnel-configs"
          TAG="v${APP_VERSION}-b${{ github.run_number }}"
          BASE_CODE=$(node -e "const m=require('fs').readFileSync('pubspec.yaml','utf8').match(/^version:\s*([0-9.]+)\+(\d+)/m);console.log(m[2])")
          cat > /tmp/version.json <<EOF
          {
            "versionName": "${APP_VERSION}",
            "versionCode": ${BASE_CODE},
            "arm64VersionCode": $((BASE_CODE * 10 + 2)),
            "armv7VersionCode": $((BASE_CODE * 10 + 1)),
            "apkDownloadUrl": "https://github.com/${REPO}/releases/download/${TAG}/SnapDark-Tunnel-${APP_VERSION}-arm64-v8a.apk",
            "armv7ApkDownloadUrl": "https://github.com/${REPO}/releases/download/${TAG}/SnapDark-Tunnel-${APP_VERSION}-armeabi-v7a.apk",
            "releaseUrl": "https://github.com/${REPO}/releases/tag/${TAG}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          SHA=$(gh api "repos/${REPO}/contents/version.json" --jq '.sha' 2>/dev/null || true)
          jq -n --arg content "$(base64 -w0 /tmp/version.json)" \
                --arg message "chore(release): version.json ${APP_VERSION} (build ${{ github.run_number }})" \
                --arg sha "$SHA" \
                '{message:$message, content:$content, branch:"main"} + (if $sha == "" then {} else {sha:$sha} end)' > /tmp/version-body.json
          gh api --method PUT "repos/${REPO}/contents/version.json" --input /tmp/version-body.json
          echo "version.json published: ${APP_VERSION} (base code ${BASE_CODE})"
